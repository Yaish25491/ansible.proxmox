---
- name: Exercise alias resource pair
  module_defaults:
    group/ansible.proxmox.proxmox:
      api_user: '{{ proxmox_api_user | default(omit, true) }}'
      api_password: '{{ proxmox_api_password | default(omit, true) }}'
      api_token_id: '{{ proxmox_api_token_id | default(omit, true) }}'
      api_token_secret: '{{ proxmox_api_token_secret | default(omit, true) }}'
      api_otp: '{{ proxmox_api_otp | default(omit, true) }}'
      ca_path: '{{ proxmox_ca_path | default(omit, true) }}'
      api_host: '{{ proxmox_api_host }}'
      api_port: '{{ proxmox_api_port | default(8006) }}'
      validate_certs: '{{ proxmox_validate_certs | default(true) }}'
  block:
    - name: Discover independent QEMU fixtures
      ansible.proxmox.proxmox_vm_info:
        node: '{{ proxmox_node }}'
      register: firewall_known_vms
      no_log: true
      when: proxmox_firewall_test_guests | default([]) | length == 0
    - name: Discover independent LXC fixtures
      ansible.proxmox.proxmox_lxc_info:
        node: '{{ proxmox_node }}'
      register: firewall_known_lxcs
      no_log: true
      when: proxmox_firewall_test_guests | default([]) | length == 0
    - name: Require both guest types before automatic fixture selection
      ansible.builtin.assert:
        that:
          - firewall_known_vms.vms | length > 0
          - firewall_known_lxcs.lxcs | length > 0
      when: proxmox_firewall_test_guests | default([]) | length == 0
    - name: Use explicitly designated guest scopes
      ansible.builtin.set_fact:
        firewall_contexts: '{{ [{''scope'': ''cluster''}] + proxmox_firewall_test_guests }}'
      when: proxmox_firewall_test_guests | default([]) | length > 0
      no_log: true
    - name: Select configured or independently discovered guest scopes
      ansible.builtin.set_fact:
        firewall_contexts: '{{ [{''scope'': ''cluster''}, {''scope'': ''qemu'', ''node'': proxmox_node, ''vmid'': (firewall_known_vms.vms
          | first).vmid}, {''scope'': ''lxc'', ''node'': proxmox_node, ''vmid'': (firewall_known_lxcs.lxcs | first).vmid}]
          }}'
      no_log: true
      when: proxmox_firewall_test_guests | default([]) | length == 0
    - name: Require coverage of both existing guest types
      ansible.builtin.assert:
        that:
          - '''qemu'' in (firewall_contexts | map(attribute=''scope'') | list)'
          - '''lxc'' in (firewall_contexts | map(attribute=''scope'') | list)'
    - name: Exercise paired lifecycle and independent reads in every scope
      ansible.builtin.include_tasks: lifecycle.yml
      loop: '{{ firewall_contexts }}'
      loop_control:
        loop_var: firewall_context
        label: '{{ firewall_context.scope }}'
