---
- name: Reject invalid selectors before API requests in both modes
  ansible.proxmox.proxmox_firewall_refs_info:
    scope: '{{ firewall_invalid.0.scope | default("cluster") }}'
    node: '{{ firewall_invalid.0.node | default(omit) }}'
    vmid: '{{ firewall_invalid.0.vmid | default(omit) }}'
    type: '{{ firewall_invalid.0.type | default(omit) }}'
  check_mode: '{{ firewall_invalid.1 }}'
  loop: '{{ [{"scope": "cluster", "node": "invalid"}, {"scope": "qemu", "node": "pve01"},
    {"scope": "lxc", "node": "invalid/path", "vmid": 101}, {"scope": "qemu", "node": "pve01", "vmid": 99}, {"type": "invalid"}]
    | product([false, true]) | list }}'
  loop_control:
    loop_var: firewall_invalid
  register: firewall_ref_invalid
  ignore_errors: true
- name: Verify every invalid selector fails without changes
  ansible.builtin.assert:
    that:
      - firewall_ref_invalid.results | length == 10
      - firewall_ref_invalid.results | selectattr('failed', 'equalto', true) | list | length == 10
      - firewall_ref_invalid.results | selectattr('changed', 'equalto', true) | list | length == 0
- name: Query a missing node without hiding discovery errors in both modes
  ansible.proxmox.proxmox_firewall_refs_info:
    scope: '{{ firewall_missing.0 }}'
    node: ansible-node-does-not-exist
    vmid: 100
  check_mode: '{{ firewall_missing.1 }}'
  loop: '{{ ["qemu", "lxc"] | product([false, true]) | list }}'
  loop_control:
    loop_var: firewall_missing
  register: firewall_ref_missing
- name: Verify successfully discovered missing nodes are empty in both guest scopes
  ansible.builtin.assert:
    that:
      - firewall_ref_missing.results | selectattr('changed', 'equalto', true) | list | length == 0
      - firewall_ref_missing.results | map(attribute='references') | reject('equalto', []) | list | length == 0
- name: Select an independently verified QEMU ID for the wrong-type query
  ansible.builtin.set_fact:
    firewall_ref_qemu_fixture: '{{ firewall_ref_guests | selectattr("type", "equalto", "qemu") | first }}'
  no_log: true
- name: Query a QEMU fixture through the LXC selection without touching its firewall
  ansible.proxmox.proxmox_firewall_refs_info:
    scope: lxc
    node: '{{ firewall_ref_qemu_fixture.node }}'
    vmid: '{{ firewall_ref_qemu_fixture.vmid }}'
  check_mode: '{{ item }}'
  loop: '{{ [false, true] }}'
  register: firewall_ref_wrong_type
  no_log: true
- name: Verify the wrong guest type is absent without changes
  ansible.builtin.assert:
    that:
      - firewall_ref_wrong_type.results | selectattr('changed', 'equalto', true) | list | length == 0
      - firewall_ref_wrong_type.results | map(attribute='references') | reject('equalto', []) | list | length == 0
  no_log: true
