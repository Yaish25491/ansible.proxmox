---
- name: Independently read the designated QEMU fixture
  ansible.proxmox.proxmox_vm_info:
    node: '{{ firewall_guest.node }}'
    vmid: '{{ firewall_guest.vmid }}'
  when: firewall_guest.type == 'qemu'
  register: firewall_guest_vm
  no_log: true
- name: Independently read the designated LXC fixture
  ansible.proxmox.proxmox_lxc_info:
    node: '{{ firewall_guest.node }}'
    vmid: '{{ firewall_guest.vmid }}'
  when: firewall_guest.type == 'lxc'
  register: firewall_guest_ct
  no_log: true
- name: Require the selected QEMU fixture to exist
  ansible.builtin.assert:
    that:
      - firewall_guest_vm.vms | length == 1
  when: firewall_guest.type == 'qemu'
  no_log: true
- name: Require the selected LXC fixture to exist
  ansible.builtin.assert:
    that:
      - firewall_guest_ct.lxcs | length == 1
  when: firewall_guest.type == 'lxc'
  no_log: true
- name: Read guest references containing owned datacenter definitions
  ansible.proxmox.proxmox_firewall_refs_info:
    scope: '{{ firewall_guest.type }}'
    node: '{{ firewall_guest.node }}'
    vmid: '{{ firewall_guest.vmid }}'
  register: firewall_guest_read
  no_log: true
- name: Read guest references in check mode
  ansible.proxmox.proxmox_firewall_refs_info:
    scope: '{{ firewall_guest.type }}'
    node: '{{ firewall_guest.node }}'
    vmid: '{{ firewall_guest.vmid }}'
  check_mode: true
  register: firewall_guest_check
  no_log: true
- name: Verify populated inherited reference names in both read modes
  ansible.builtin.assert:
    that:
      - firewall_guest_read is not changed
      - firewall_guest_check is not changed
      - firewall_ref_fixtures | map(attribute='id') | difference(firewall_guest_read.references | map(attribute='name') | list) | length == 0
      - firewall_ref_fixtures | map(attribute='id') | difference(firewall_guest_check.references | map(attribute='name') | list) | length == 0
  no_log: true
- name: Verify both guest type filters and exact inherited reference metadata in both modes
  ansible.builtin.include_tasks: reference.yml
  vars:
    firewall_ref_scope: '{{ firewall_guest.type }}'
    firewall_ref_node: '{{ firewall_guest.node }}'
    firewall_ref_vmid: '{{ firewall_guest.vmid }}'
    firewall_ref_normal_references: '{{ firewall_guest_read.references }}'
    firewall_ref_check_references: '{{ firewall_guest_check.references }}'
  loop: '{{ firewall_ref_fixtures | product([false, true]) | list }}'
  loop_control:
    loop_var: firewall_reference_case
