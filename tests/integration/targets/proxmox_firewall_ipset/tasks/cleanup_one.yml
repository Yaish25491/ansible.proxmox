---
- name: Read the owned name before cleanup
  ansible.proxmox.proxmox_firewall_ipset_info:
    name: '{{ firewall_cleanup_name }}'
    scope: '{{ firewall_context.scope }}'
    node: '{{ firewall_context.node | default(omit) }}'
    vmid: '{{ firewall_context.vmid | default(omit) }}'
  register: firewall_cleanup_read
  ignore_errors: true
- name: Require recognized ownership metadata before removal
  ansible.builtin.set_fact:
    firewall_cleanup_safe: '{{ firewall_cleanup_read is succeeded and (firewall_cleanup_read.ipsets | length == 0 or
      ((firewall_cleanup_read.ipsets[0].comment | default('''')) in ['''', ''Owned Ansible firewall fixture'', ''Updated
      Ansible firewall fixture''] and (firewall_cleanup_read.ipsets[0].entries | map(attribute=''cidr'') | difference([''192.0.2.0/24'',
      ''2001:db8::1'', ''198.51.100.2'']) | length == 0))) }}'
- name: Remove only a recognized owned definition
  ansible.proxmox.proxmox_firewall_ipset:
    name: '{{ firewall_cleanup_name }}'
    scope: '{{ firewall_context.scope }}'
    node: '{{ firewall_context.node | default(omit) }}'
    vmid: '{{ firewall_context.vmid | default(omit) }}'
    state: absent
    force: true
  when: firewall_cleanup_safe | bool
  register: firewall_cleanup_removed
  ignore_errors: true
- name: Retain every cleanup refusal or failed removal
  ansible.builtin.set_fact:
    firewall_cleanup_errors: '{{ firewall_cleanup_errors + ([firewall_cleanup_name] if (not firewall_cleanup_safe | bool
      or firewall_cleanup_removed is failed) else []) }}'
