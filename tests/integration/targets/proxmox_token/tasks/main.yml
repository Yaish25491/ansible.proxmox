---
- name: Reset fixture ownership for this invocation
  ansible.builtin.set_fact:
    token_cleanup_allowed: false
- name: Exercise token lifecycle and independent information reads
  module_defaults:
    group/ansible.proxmox.proxmox: &id001
      api_host: '{{ proxmox_api_host }}'
      api_port: '{{ proxmox_api_port | default(8006) }}'
      api_user: '{{ proxmox_api_user | default(omit, true) }}'
      api_password: '{{ proxmox_api_password | default(omit, true) }}'
      api_token_id: '{{ proxmox_api_token_id | default(omit, true) }}'
      api_token_secret: '{{ proxmox_api_token_secret | default(omit, true) }}'
      ca_path: '{{ proxmox_ca_path | default(omit, true) }}'
      validate_certs: '{{ proxmox_validate_certs | default(true) }}'
    proxmox_token_fixture: *id001
  block:
    - name: Verify every token owner identifier is unused
      proxmox_token_fixture:
        resource_id: '{{ item }}'
        owned_ids: '{{ token_test_owned_users }}'
        read_only: true
      loop: '{{ token_test_owned_users }}'
      register: token_owner_preflight
    - name: Require an absent owner before claiming it
      ansible.builtin.assert:
        that:
          - token_test_owned_users | unique | length == token_test_owned_users | length
          - token_owner_preflight.results | rejectattr('fixture', 'none') | list | length == 0
    - name: Verify the token identifier is absent
      ansible.proxmox.proxmox_token_info:
        userid: '{{ token_test_user }}'
        tokenid: '{{ token_test_id }}'
      register: token_preflight
    - name: Require no token before claiming it
      ansible.builtin.assert:
        that:
          - token_preflight.tokens == []
    - name: Claim only the verified absent identity fixtures
      ansible.builtin.set_fact:
        token_cleanup_allowed: true
    - name: Create only the owned disabled passwordless PVE users
      proxmox_token_fixture:
        resource_id: '{{ item }}'
        owned_ids: '{{ token_test_owned_users }}'
      loop: '{{ token_test_owned_users }}'
      register: token_owner_created
    - name: Exercise lifecycle predictions actual values and repeated no-ops
      ansible.builtin.include_tasks: lifecycle.yml
    - name: Create the owned sibling sentinel token and hide its creation secret
      ansible.proxmox.proxmox_token:
        userid: '{{ token_test_sibling_user }}'
        tokenid: '{{ token_test_id }}'
        comment: Untouched sibling token
      no_log: true
    - name: Exercise literal special-character owners independently of their sibling
      ansible.builtin.include_tasks: literal_owner.yml
      loop: '{{ token_test_special_users }}'
      loop_control:
        loop_var: token_literal_owner
    - name: Exercise rejected requests without touching unrelated identities
      ansible.builtin.include_tasks: errors.yml
  always:
    - name: Clean and independently verify owned identity fixtures
      ansible.builtin.include_tasks: cleanup.yml
      when: token_cleanup_allowed | default(false)
