---
- name: Continue removing only the owned custom role identifiers
  ansible.proxmox.proxmox_role:
    roleid: '{{ item }}'
    state: absent
  register: role_cleanup_delete
  ignore_errors: true
  loop: '{{ [role_test_id, role_test_reserved_prefix] }}'
- name: Independently verify custom role cleanup
  ansible.proxmox.proxmox_role_info:
    roleid: '{{ item }}'
  register: role_cleanup_actual
  loop: '{{ [role_test_id, role_test_reserved_prefix] }}'
- name: Expose any remaining custom role
  ansible.builtin.assert:
    that:
      - item is not changed
      - item.roles == []
  loop: '{{ role_cleanup_actual.results }}'
