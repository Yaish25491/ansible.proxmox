---
proxmox_node: pve01
firewall_log_test_limit: 3
firewall_log_require_content: true
firewall_log_test_since: 1
firewall_log_test_until: 4102444800
# Native pvefw-logger format: VMID level chain day/month/year:time offset message.
firewall_log_test_content_pattern: '^[0-9]+ [0-9]+ \S+ [0-9]{2}/[A-Za-z]{3}/[0-9]{4}:[0-9]{2}:[0-9]{2}:[0-9]{2} [+-][0-9]{4}(?: |$)'
firewall_log_test_timestamp_format: '%d/%b/%Y:%H:%M:%S %z'
