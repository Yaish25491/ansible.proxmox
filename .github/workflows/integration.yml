---
name: Integration

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'plugins/**'
      - 'requirements.txt'
      - 'tests/integration/**'
      - 'Makefile'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: read

concurrency:
  group: proxmox-integration-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  approve:
    name: Approve Integration
    runs-on: ubuntu-latest
    environment: eco-proxmox-protected
    if: >-
      github.actor != 'pre-commit-ci[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event_name == 'pull_request_target'
    steps:
      - name: Confirm approval
        run: echo "Integration approved"

  integration:
    name: "Integration (${{ matrix.ansible_version }})"
    runs-on: [self-hosted, proxmox]
    needs:
      - approve
    if: >-
      always() && github.actor != 'pre-commit-ci[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (needs.approve.result == 'success' ||
       github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ansible_version:
          - stable-2.16
          - stable-2.18
          - stable-2.20
          - stable-2.21
    defaults:
      run:
        shell: bash
        working-directory: ansible_collections/ansible/proxmox
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: ansible_collections/ansible/proxmox
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Install ansible-core (${{ matrix.ansible_version }})
        env:
          ANSIBLE_VERSION: ${{ matrix.ansible_version }}
        run: |
          set -euo pipefail
          integration_venv="$(mktemp -d "${RUNNER_TEMP}/proxmox-venv.XXXXXX")"
          printf 'INTEGRATION_VENV=%s\n' "${integration_venv}" >> "${GITHUB_ENV}"
          python3.12 -m venv "${integration_venv}"
          source "${integration_venv}/bin/activate"
          python -m pip install "git+https://github.com/ansible/ansible.git@${ANSIBLE_VERSION}"

      - name: Install collection dependencies
        run: |
          source "${INTEGRATION_VENV}/bin/activate"
          python -m pip install -r tests/integration/requirements.txt

      - name: List integration targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          source "${INTEGRATION_VENV}/bin/activate"
          if [[ "${EVENT_NAME}" == 'pull_request_target' ]]; then
            git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            git branch -f "${BASE_REF}" "origin/${BASE_REF}"
            git checkout -B "integration-pr-${PR_NUMBER}" HEAD
            git diff --name-only "origin/${BASE_REF}...HEAD" -- \
              ':(glob)plugins/**' \
              'requirements.txt' \
              ':(glob)tests/integration/**' \
              'Makefile' > "${RUNNER_TEMP}/ansible-changed-files.txt"
            if [[ -s "${RUNNER_TEMP}/ansible-changed-files.txt" ]]; then
              cat "${RUNNER_TEMP}/ansible-changed-files.txt"
              ansible-test integration --list-targets \
                --changed-from "${RUNNER_TEMP}/ansible-changed-files.txt" > targets.txt
            else
              : > targets.txt
            fi
          else
            ansible-test integration --list-targets > targets.txt
          fi
          if [[ "${EVENT_NAME}" == 'schedule' && ! -s targets.txt ]]; then
            echo "::error::Scheduled integration run discovered no targets."
            exit 1
          fi
          cat targets.txt

      - name: Run password-authenticated TFA integration tests
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
          ANSIBLE_VERSION: ${{ matrix.ansible_version }}
          PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
          PROXMOX_USER: root@pam
          PROXMOX_PASSWORD: ${{ secrets.PROXMOX_TFA_ROOT_PASSWORD }}
          PROXMOX_TOKEN_ID: ''
          PROXMOX_TOKEN_SECRET: ''
          PROXMOX_TFA_ALLOW_ENROLLMENT: ${{ vars.PROXMOX_TFA_ALLOW_ENROLLMENT }}
          PROXMOX_VALIDATE_CERTS: ${{ secrets.PROXMOX_VALIDATE_CERTS }}
          PROXMOX_CA_PATH: ${{ secrets.PROXMOX_CA_PATH }}
        run: |
          set -euo pipefail
          selected=false
          while IFS= read -r target; do
            if [[ "${target}" == proxmox_tfa ]]; then
              selected=true
            fi
          done < targets.txt
          if [[ "${selected}" != true ]]; then
            exit 0
          fi
          if [[ -z "${PROXMOX_PASSWORD}" || "${PROXMOX_TFA_ALLOW_ENROLLMENT}" != true ]]; then
            echo "::error::TFA enrollment requires the approved PROXMOX_TFA_ROOT_PASSWORD repository secret."
            echo "Set repository variable PROXMOX_TFA_ALLOW_ENROLLMENT=true after authorizing owned fixtures."
            echo "Job approval alone does not supply these prerequisites."
            exit 1
          fi
          source "${INTEGRATION_VENV}/bin/activate"
          umask 077
          make -B generate-integration-config
          make integration \
            ANSIBLE_CORE_SPEC="git+https://github.com/ansible/ansible.git@${ANSIBLE_VERSION}" \
            INTEGRATION_TARGETS="proxmox_tfa" \
            CLI_ARGS="-v --color"

      - name: Run integration tests
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
          ANSIBLE_VERSION: ${{ matrix.ansible_version }}
          PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
          PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
          PROXMOX_VALIDATE_CERTS: ${{ secrets.PROXMOX_VALIDATE_CERTS }}
          PROXMOX_CA_PATH: ${{ secrets.PROXMOX_CA_PATH }}
          PROXMOX_PASSWORD: ''
          PROXMOX_TFA_ALLOW_ENROLLMENT: 'false'
        run: |
          set -euo pipefail
          source "${INTEGRATION_VENV}/bin/activate"
          targets=()
          while IFS= read -r target; do
            if [[ -n "${target}" && "${target}" != proxmox_tfa ]]; then
              targets+=("${target}")
            fi
          done < targets.txt
          if (( ${#targets[@]} == 0 )); then
            echo "No integration targets selected."
            exit 0
          fi
          umask 077
          make -B generate-integration-config
          make integration \
            ANSIBLE_CORE_SPEC="git+https://github.com/ansible/ansible.git@${ANSIBLE_VERSION}" \
            INTEGRATION_TARGETS="${targets[*]}" \
            CLI_ARGS="-v --color"

      - name: Clean integration files
        if: always()
        run: |
          if [[ -n "${INTEGRATION_VENV:-}" ]]; then
            rm -rf -- "${INTEGRATION_VENV}"
          fi
          rm -f tests/integration/integration_config.yml targets.txt "${RUNNER_TEMP}/ansible-changed-files.txt"

  check:
    if: >-
      always() && github.actor != 'pre-commit-ci[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs:
      - approve
      - integration
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: >-
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'approve' || '' }}
          jobs: ${{ toJSON(needs) }}
